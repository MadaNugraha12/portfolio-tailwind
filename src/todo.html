<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Abimada Portfolio</title>
    <link rel="stylesheet" href="./output.css">
    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="min-h-screen bg-[#F4F4F3] text-slate-800 antialiased font-sans selection:bg-slate-900 selection:text-white">

    <!-- ================= NAVBAR ================= -->
    <nav class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center px-6 py-6">
        <a href="./index.html" class="text-xl font-black tracking-widest text-slate-900 hover:opacity-80 transition-opacity">
            ABIMADA<span class="text-xs text-slate-400 font-mono ml-1">.DEV</span>
        </a>

        <div class="flex items-center gap-8 mt-4 md:mt-0 text-sm font-medium text-slate-600">
            <a href="./index.html" class="hover:text-slate-900 transition-colors">Home</a>
            <a href="./about.html" class="hover:text-slate-900 transition-colors">About</a>
            <a href="./projects.html" class="hover:text-slate-900 transition-colors">Projects</a>
            <a href="./contact.html" class="hover:text-slate-900 transition-colors">Contact</a>
            <a href="./todo.html" class="text-slate-900 font-semibold border-b-2 border-slate-900 pb-0.5">To-Do</a>
        </div>
    </nav>


    <!-- ================= MAIN CONTENT ================= -->
    <main class="px-4 md:px-6 py-4 md:py-8">

        <section class="max-w-6xl mx-auto bg-[#ECECEB] rounded-3xl p-8 md:p-14 border border-black/5 shadow-sm">

            <!-- Section Title -->
            <div class="mb-10 border-b border-slate-300/60 pb-6 text-center md:text-left">
                <span class="text-xs font-mono uppercase tracking-widest text-slate-400">JavaScript Assignment</span>
                <h1 class="text-4xl md:text-5xl font-serif text-slate-900 mt-1">
                    Task <span class="italic font-normal">Manager.</span>
                </h1>
                <p class="text-slate-500 text-xs md:text-sm mt-2 font-mono">
                    // Manage your daily tasks interactively
                </p>
            </div>

            <!-- Bento Container For To-Do -->
            <div class="bg-white/70 backdrop-blur-sm p-6 md:p-8 rounded-2xl border border-black/5 shadow-sm space-y-6">

                <!-- Input Section -->
                <div class="flex flex-col sm:flex-row gap-3">
                    <input
                        id="taskInput"
                        type="text"
                        placeholder="Enter your task..."
                        class="flex-1 px-4 py-3.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition-all placeholder:text-slate-400">

                    <button
                        id="addTaskButton"
                        class="bg-slate-900 text-white px-7 py-3.5 rounded-xl font-medium text-sm hover:bg-slate-800 transition-all hover:scale-[1.02] active:scale-95 shadow-lg shadow-slate-900/10 flex items-center justify-center gap-2 shrink-0">
                        <span>Add Task</span>
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                </div>

                <!-- Task List Container -->
                <div class="pt-2">
                    <ul id="taskList" class="space-y-3">
                        <!-- Dynamic items -->
                    </ul>
                </div>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="py-8 text-center text-xs text-slate-400 font-mono">
        <p>© 2026 ABIMADA PORTFOLIO — BUILT WITH TAILWIND CSS</p>
    </footer>


    <!-- ================= JAVASCRIPT ================= -->
    <script>
        const taskInput = document.getElementById("taskInput");
        const addTaskButton = document.getElementById("addTaskButton");
        const taskList = document.getElementById("taskList");

        // 1. Muat data dari localStorage saat halaman pertama kali dibuka
        document.addEventListener("DOMContentLoaded", loadTasks);

        addTaskButton.addEventListener("click", addTask);

        taskInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                addTask();
            }
        });

        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText === "") return;

            createTaskElement(taskText, false);
            saveTasks();

            taskInput.value = "";
            taskInput.focus();
        }

        function createTaskElement(text, completed) {
            const task = document.createElement("li");
            task.className = "flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm hover:border-slate-300 transition-all cursor-pointer group";

            task.innerHTML = `
                <span class="task-text text-slate-800 text-sm font-medium flex items-center gap-2 ${completed ? 'line-through text-slate-400' : ''}">
                    <span class="w-2 h-2 rounded-full ${completed ? 'bg-slate-300' : 'bg-slate-900'} font-bullet"></span>
                    ${text}
                </span>

                <button class="delete-btn text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors text-xs font-mono flex items-center gap-1">
                    <i class="fa-solid fa-trash-can"></i>
                    <span class="hidden sm:inline">Delete</span>
                </button>
            `;

            // Fitur Toggle Completed (Coret task jika diklik)
            task.addEventListener("click", function (e) {
                if (e.target.closest('.delete-btn')) return; // Jangan jalankan jika yang diklik tombol delete
                
                const span = task.querySelector(".task-text");
                const bullet = task.querySelector(".font-bullet");
                
                span.classList.toggle("line-through");
                span.classList.toggle("text-slate-400");
                bullet.classList.toggle("bg-slate-300");
                bullet.classList.toggle("bg-slate-900");
                
                saveTasks();
            });

            // Fitur Delete
            task.querySelector(".delete-btn").addEventListener("click", function () {
                task.remove();
                saveTasks();
            });

            taskList.appendChild(task);
        }

        // Simpan daftar task ke localStorage
        function saveTasks() {
            const tasks = [];
            document.querySelectorAll("#taskList li").forEach(li => {
                const text = li.querySelector(".task-text").innerText.trim();
                const completed = li.querySelector(".task-text").classList.contains("line-through");
                tasks.push({ text, completed });
            });
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        // Ambil data dari localStorage
        function loadTasks() {
            const savedTasks = JSON.parse(localStorage.getItem("tasks")) || [];
            savedTasks.forEach(task => createTaskElement(task.text, task.completed));
        }
    </script>

</body>

</html>
