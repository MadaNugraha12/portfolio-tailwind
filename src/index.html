<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home - Abimada Portfolio</title>

    <link rel="stylesheet" href="./output.css">
    <!-- Font Awesome untuk ikon sosial & status -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="min-h-screen bg-[#F4F4F3] text-slate-800 antialiased font-sans selection:bg-slate-900 selection:text-white">

    <!-- ================= NAVBAR ================= -->
    <nav class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center px-6 py-6">

        <!-- Logo -->
        <a href="./index.html" class="text-xl font-black tracking-widest text-slate-900 hover:opacity-80 transition-opacity">
            ABIMADA<span class="text-xs text-slate-400 font-mono ml-1">.DEV</span>
        </a>

        <!-- Menu -->
        <div class="flex items-center gap-8 mt-4 md:mt-0 text-sm font-medium text-slate-600">

            <a href="./index.html" class="text-slate-900 font-semibold border-b-2 border-slate-900 pb-0.5">
                Home
            </a>

            <a href="./about.html" class="hover:text-slate-900 transition-colors">
                About
            </a>

            <a href="./projects.html" class="hover:text-slate-900 transition-colors">
                Projects
            </a>

            <a href="./contact.html" class="hover:text-slate-900 transition-colors">
                Contact
            </a>

            <a href="./todo.html" class="hover:text-slate-900 transition-colors">
                To-Do
            </a>

        </div>

    </nav>


    <!-- ================= HERO SECTION ================= -->
    <main class="px-4 md:px-6 py-4 md:py-8">

        <section class="max-w-6xl mx-auto bg-[#ECECEB] rounded-3xl p-8 md:p-14 border border-black/5 shadow-sm">

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">

                <!-- ================= TEXT ================= -->
                <div class="lg:col-span-7 text-left space-y-6">

                    <!-- Location / Social Tag -->
                    <div class="flex items-center gap-2 text-slate-500 text-xs font-mono tracking-wider">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>BADUNG,BALI,INDONESIA</span>
                    </div>

                    <!-- Main Heading -->
                    <div>
                        <h1 class="text-5xl sm:text-6xl md:text-7xl font-serif text-slate-900 tracking-tight leading-none mb-3">
                            Hi, I'm <span class="italic font-normal">Abimada.</span>
                        </h1>

                        <p class="text-lg md:text-2xl text-slate-600 font-sans tracking-wide">
                            Computer Science Student
                        </p>
                    </div>

                    <!-- Call To Action -->
                    <div class="pt-2 flex items-center gap-4">
                        <a href="./projects.html"
                            class="inline-flex items-center gap-2 bg-slate-900 text-white px-7 py-3.5 rounded-full text-sm font-medium hover:bg-slate-800 transition-all hover:scale-105 active:scale-95 shadow-lg shadow-slate-900/10">
                            <span>View My Projects</span>
                            <i class="fa-solid fa-arrow-right text-xs"></i>
                        </a>
                    </div>

                </div>


                <!-- ================= PHOTO CARD (BENTO STYLE) ================= -->
                <div class="lg:col-span-5 flex justify-center">

                    <div class="relative w-full max-w-sm aspect-[4/5] bg-slate-950 rounded-2xl overflow-hidden shadow-2xl p-4 flex flex-col justify-end group border border-slate-800">

                        <!-- Foto Profil -->
                        <img src="./Mada.jpeg" alt="Abimada"
                            class="absolute inset-0 w-full h-full object-cover object-top opacity-90 group-hover:scale-105 transition-transform duration-500">

                        <!-- Overlay Gradasi Gelap di Bawah -->
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>

                        <!-- Card Badge Info -->
                        <div class="relative z-10 bg-slate-900/80 backdrop-blur-md border border-white/10 rounded-xl p-3.5 text-white flex items-center justify-between">
                            <div>
                                <p class="text-xs font-mono text-slate-300">@abimada</p>
                                <p class="text-xs text-emerald-400 font-medium flex items-center gap-1.5 mt-0.5">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                    Available for work
                                </p>
                            </div>
                            <i class="fa-solid fa-code text-slate-400 text-sm"></i>
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="py-8 text-center text-xs text-slate-400 font-mono">

        <p>
            © 2026 ABIMADA PORTFOLIO — BUILT WITH TAILWIND CSS
        </p>

    </footer>

</body>

</html>
