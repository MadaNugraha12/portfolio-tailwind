<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Converter - Abimada Portfolio</title>
    <link rel="stylesheet" href="./output.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="min-h-screen bg-[#F4F4F3] text-slate-800 antialiased font-sans selection:bg-slate-900 selection:text-white">

    <!-- NAVBAR STICKY -->
    <nav class="sticky top-0 z-50 bg-[#F4F4F3]/90 backdrop-blur-md border-b border-slate-300/50 py-4 px-6" style="position: sticky; top: 0; z-index: 50; background-color: rgba(244, 244, 243, 0.9); backdrop-filter: blur(8px);">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <!-- Logo -->
            <a href="./index.html" class="text-xl font-black tracking-widest text-slate-900 hover:opacity-80 transition-opacity">
                ABIMADA<span class="text-xs text-slate-400 font-mono ml-1">.DEV</span>
            </a>

            <!-- Menu -->
            <div class="flex items-center gap-6 mt-4 md:mt-0 text-sm font-medium text-slate-600">
                <a href="./index.html" class="hover:text-slate-900 transition-colors">Home</a>
                <a href="./about.html" class="hover:text-slate-900 transition-colors">About</a>
                <a href="./projects.html" class="hover:text-slate-900 transition-colors">Projects</a>
                <a href="./contact.html" class="hover:text-slate-900 transition-colors">Contact</a>
                <a href="./calculator.html" class="px-4 py-2 bg-slate-800 text-emerald-400 rounded-full text-xs font-mono transition-all shadow-md ring-2 ring-slate-900">
                    <i class="fa-solid fa-calculator me-1"></i> Calculator
                </a>
            </div>
        </div>
    </nav>


    <!-- MAIN CONTENT -->
    <main class="px-4 md:px-6 py-4 md:py-8">

        <section class="max-w-4xl mx-auto bg-[#ECECEB] rounded-3xl p-8 md:p-14 border border-black/5 shadow-sm">

            <!-- Section Title -->
            <div class="mb-10 border-b border-slate-300/60 pb-6 text-center md:text-left">
                <span class="text-xs font-mono uppercase tracking-widest text-slate-400">Math & Computer Logic</span>
                <h1 class="text-4xl md:text-5xl font-serif text-slate-900 mt-1">
                    Binary <span class="italic font-normal">Converter.</span>
                </h1>
                <p class="text-slate-500 text-xs md:text-sm mt-2 font-mono">
                    // Convert Binary (Base 2) to Decimal (Base 10) & vice versa
                </p>
            </div>

            <!-- Bento Container For Converter -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Left Card: Inputs & Mode Selector -->
                <div class="bg-white/80 backdrop-blur-sm p-6 md:p-8 rounded-2xl border border-black/5 shadow-sm space-y-6">
                    <div>
                        <label class="block text-xs font-mono uppercase tracking-wider text-slate-500 mb-2">
                            Conversion Mode
                        </label>
                        <select id="modeSelect" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-all cursor-pointer">
                            <option value="binToDec">Binary → Decimal</option>
                            <option value="decToBin">Decimal → Binary</option>
                        </select>
                    </div>

                    <div>
                        <label id="inputLabel" class="block text-xs font-mono uppercase tracking-wider text-slate-500 mb-2">
                            Enter Binary Number (e.g. 10110)
                        </label>
                        <input
                            id="numberInput"
                            type="text"
                            placeholder="Type digits here..."
                            class="w-full px-4 py-3.5 bg-white border border-slate-200 rounded-xl text-base font-mono focus:outline-none focus:ring-2 focus:ring-slate-900 transition-all placeholder:text-slate-300">
                        <p id="errorMessage" class="text-xs text-red-500 mt-2 font-mono hidden">
                            <i class="fa-solid fa-circle-exclamation me-1"></i> Invalid input!
                        </p>
                    </div>

                    <button
                        id="convertBtn"
                        class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-medium text-sm hover:bg-slate-800 transition-all hover:scale-[1.01] active:scale-95 shadow-lg shadow-slate-900/10 flex items-center justify-center gap-2">
                        <span>Calculate Conversion</span>
                        <i class="fa-solid fa-arrow-right-arrow-left text-xs"></i>
                    </button>
                </div>

                <!-- Right Card: Result & Step-by-Step Logic -->
                <div class="bg-slate-900 text-white p-6 md:p-8 rounded-2xl border border-slate-800 shadow-xl flex flex-col justify-between space-y-6">
                    <div>
                        <span class="text-xs font-mono text-slate-400 uppercase tracking-widest block mb-1">Result</span>
                        <div id="resultDisplay" class="text-3xl md:text-4xl font-mono font-bold text-emerald-400 break-all">
                            0
                        </div>
                    </div>

                    <div class="border-t border-slate-800 pt-4">
                        <span class="text-xs font-mono text-slate-400 uppercase tracking-widest block mb-2">Mathematical Logic Steps:</span>
                        <div id="logicSteps" class="text-xs font-mono text-slate-300 bg-slate-950/80 p-4 rounded-xl border border-slate-800 max-h-48 overflow-y-auto leading-relaxed space-y-1">
                            Waiting for input...
                        </div>
                    </div>
                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="py-8 text-center text-xs text-slate-400 font-mono">
        <p>© 2026 ABIMADA PORTFOLIO — BUILT WITH TAILWIND CSS</p>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="./script.js"></script>

</body>

</html>
